---
# Debian/Ubuntu prerequisites, mirroring docs/guides/BUILDING.md
# ("Installing prerequisites on Linux") in the connectedhomeip repo.

# On a freshly-flashed image, apt-daily / unattended-upgrades holds the dpkg
# lock for the first several minutes after boot, so any apt run fails to get it.
# Waiting is far friendlier than a confusing lock error.
- name: Wait for any in-progress apt/dpkg lock to be released
  become: true
  ansible.builtin.shell:
    cmd: |
      for _ in $(seq 1 120); do
        if ! fuser /var/lib/dpkg/lock-frontend /var/lib/apt/lists/lock \
                   /var/cache/apt/archives/lock >/dev/null 2>&1; then
          exit 0
        fi
        sleep 5
      done
      echo "apt lock still held after 10 minutes" >&2
      exit 1
  args:
    executable: /bin/bash
  changed_when: false

- name: Install connectedhomeip build prerequisites
  become: true
  ansible.builtin.apt:
    update_cache: true
    lock_timeout: 300
    state: present
    name:
      - git
      - gcc
      - g++
      - pkg-config
      - cmake
      - curl
      - libssl-dev
      - libdbus-1-dev
      - libglib2.0-dev
      - libavahi-client-dev
      - ninja-build
      - python3-venv
      - python3-dev
      - python3-pip
      - unzip
      - libgirepository1.0-dev
      - libcairo2-dev
      - libreadline-dev
      - libevent-dev
      - default-jre

# Matter commissioning is DNS-SD based, so a DUT running on this host is not
# discoverable without mDNS. Cheap to ensure, confusing to debug when missing.
- name: Install and enable Avahi so Matter devices are discoverable
  become: true
  ansible.builtin.apt:
    state: present
    name:
      - avahi-daemon
      - avahi-utils

- name: Ensure avahi-daemon is running and enabled
  become: true
  ansible.builtin.systemd:
    name: avahi-daemon
    state: started
    enabled: true
