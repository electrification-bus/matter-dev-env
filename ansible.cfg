[defaults]
inventory = inventory.ini
roles_path = roles
host_key_checking = False
interpreter_python = auto_silent
stdout_callback = default
callback_result_format = yaml
# Long, quiet steps (pigweed bootstrap, a full example-app build) otherwise look
# like a hang. Show the task that is running.
display_skipped_hosts = False

[ssh_connection]
# Keep the connection alive through the long, silent build steps when running
# against a remote host.
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o ServerAliveInterval=30 -o ServerAliveCountMax=120
pipelining = True
