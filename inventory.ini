# Hosts to provision with a Matter SDK development environment.
#
# The default is this machine, provisioned over a local connection (no SSH, no
# credentials, nothing to configure). This is the common case.
#
# To provision another machine instead, add it below and run with -l <host>:
#
#   [matter_dev]
#   localhost      ansible_connection=local
#   devbox.local   ansible_user=you
#
#   ansible-playbook setup.yml -l devbox.local
#
# Nothing else in this repo changes between local and remote; the roles do not
# care which they are running against.

[matter_dev]
localhost ansible_connection=local
